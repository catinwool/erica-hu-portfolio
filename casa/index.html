<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>casa</title>
    <meta
      name="description"
      content="A painted room. A couch, a board, a lamp, records, a desk, a shelf, plants, and a ceiling light."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f24a81;
        overflow: hidden;
      }

      .room {
        position: fixed;
        inset: 0;
        overflow: hidden;
        touch-action: none;
        overscroll-behavior: none;
      }

      .stage {
        position: absolute;
        left: 50%;
        top: 50%;
        width: max(100vw, calc(100vh * 16 / 9));
        aspect-ratio: 16 / 9;
        transform: translate(-50%, -50%);
      }

      .bg,
      .piece {
        position: absolute;
        user-select: none;
        -webkit-user-drag: none;
      }

      .bg {
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: fill;
      }

      .piece {
        height: auto;
        touch-action: none;
      }

      .piece.away {
        visibility: hidden;
        pointer-events: none;
      }

      .piece.dragging {
        z-index: 12;
      }

      input,
      textarea {
        cursor: text;
      }

      .casa-cursor {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 40;
        width: 0;
        height: 0;
        pointer-events: none;
        overflow: visible;
      }

      .casa-cursor[hidden] {
        display: none;
      }

      .casa-cursor-glow {
        position: absolute;
        left: 0;
        top: 0;
        width: 240px;
        height: 240px;
        transform: translate(-50%, -50%);
        background: radial-gradient(
          circle,
          rgba(255, 232, 190, 0.95) 0%,
          rgba(255, 190, 90, 0.42) 16%,
          rgba(255, 160, 50, 0.14) 36%,
          rgba(255, 150, 40, 0.04) 54%,
          transparent 68%
        );
        opacity: 0.8;
      }

      .casa-cursor.lit .casa-cursor-glow {
        animation: cursor-glow 1.35s ease-in-out infinite;
      }

      @keyframes cursor-glow {
        0%,
        100% {
          transform: translate(-50%, -50%) scale(0.78);
          opacity: 0.45;
        }
        50% {
          transform: translate(-50%, -50%) scale(1.16);
          opacity: 1;
        }
      }

      .casa-cursor img {
        position: absolute;
        width: 22px;
        height: auto;
        left: 0;
        top: 0;
        transform: translate(-50%, -27%);
        user-select: none;
        -webkit-user-drag: none;
      }

      .casa-cursor .cursor-on {
        opacity: 0;
      }

      .casa-cursor.lit .cursor-off {
        opacity: 0;
      }

      .casa-cursor.lit .cursor-on {
        opacity: 1;
      }

      @media (hover: hover) and (pointer: fine) {
        html.has-cursor,
        html.has-cursor body,
        html.has-cursor .piece,
        html.has-cursor button,
        html.has-cursor a,
        html.has-cursor [role="button"],
        html.has-cursor [role="link"] {
          cursor: none;
        }

        html.has-cursor input,
        html.has-cursor textarea {
          cursor: text;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .casa-cursor.lit .casa-cursor-glow {
          animation: none;
          transform: translate(-50%, -50%) scale(1);
          opacity: 1;
        }
      }

      #lamp.lit .lamp-on,

      .books,
      .notes {

        inset: 0;
        z-index: 20;

        justify-content: center;

      .books-card,

        display: flex;
        flex-direction: column;
        background: #fffdf6;
        border: 3px solid #243044;

      .books-head,

        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 16px 8px;

      .books-head h2,
      .notes-head h2 {

        font-size: 22px;

      .books-head button,

      .books-head button,

      .notes {
        align-items: stretch;
        justify-content: flex-start;

      .notes-card {
        width: 100%;
        height: 100%;
        max-height: none;
        background: transparent;
        border: 0;
        box-shadow: none;
      }

      .notes-close {
        position: absolute;
        top: 12px;

        z-index: 2;

      }

      .notes-board {
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px 16px 12px;
      }

      .notes-surface {
        position: relative;
        width: min(980px, 100%);
        height: 100%;
        background: #f4e6cf;
        border: 12px solid #fffdf6;
        box-shadow: inset 0 0 0 2px #243044, 8px 10px 0 rgba(36, 48, 68, 0.12);
      }

      .notes-form {
        flex: none;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
        background: #fffdf6;
        border-top: 3px solid #243044;
      }

      .notes-form textarea,
      .notes-form input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        border: 2px solid #243044;
        background: #fff;
        font: inherit;
        color: inherit;
      }

      .notes-form textarea {
        min-height: 76px;
        resize: vertical;
      }

      .notes-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .notes-row input {
        flex: 1;
        min-width: 0;
      }

      .notes-form button {
        background: #fffdf6;
        padding: 8px 12px;
      }

      .notes-drop {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 96px;
        border: 2px dashed #243044;
        background: #fff;
        overflow: hidden;
      }

      .notes-drop.over {
        background: #fff6d8;
      }

      .notes-drop.has-picture {
        border-style: solid;
        min-height: 160px;
      }

      .notes-file {
        position: absolute;
        inset: 0;
        z-index: 1;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        border: 0;
        opacity: 0;
        cursor: pointer;
      }

      .notes-drop-hint {
        color: #8a7b6a;
        pointer-events: none;
      }

      .notes-drop.has-picture .notes-drop-hint {
        display: none;
      }

      .notes-drop img {
        display: none;
        max-width: 100%;
        max-height: 180px;
        object-fit: contain;
        background: #fffdf6;
      }

      .notes-drop.has-picture img {
        display: block;
        width: 100%;
        height: 160px;
      }

      #notes-clear {
        position: absolute;
        right: 8px;
        bottom: 8px;
        z-index: 2;
      }

      #notes-clear[hidden] {
        display: none;
      }

      .notes-status {
        margin: 0;
        min-height: 1.2em;
        font-size: 14px;
        color: #5c4a3a;
      }

      .notes-honey {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        border: 0;
      }

      .notes-list {
        position: absolute;
        inset: 16px;
        margin: 0;
        padding: 18px 10px 24px;
        list-style: none;
        overflow: auto;
        display: flex;
        flex-wrap: wrap;
        gap: 18px 14px;
        align-content: flex-start;
        align-items: flex-start;
      }

      .notes-list li {
        --paper: #ffe566;
        --fold: #efc63a;
        position: relative;
        width: min(176px, calc(50% - 12px));
        min-height: 168px;
        box-sizing: border-box;
        margin: 4px;
        padding: 16px 14px 26px;
        background: var(--paper);
        border: 0;
        box-shadow: 3px 5px 0 rgba(36, 48, 68, 0.05), 6px 12px 16px rgba(36, 48, 68, 0.16);
        font-family: "Bradley Hand", "Segoe Print", "Chalkboard SE", cursive;
        transform: rotate(-2deg);
      }

      .notes-list li::after {
        content: "";
        position: absolute;
        right: 0;
        bottom: 0;
        border-style: solid;
        border-width: 0 0 22px 22px;
        border-color: transparent transparent #f4e6cf var(--fold);
        box-shadow: -1px -1px 0 rgba(36, 48, 68, 0.06);
      }

      .notes-list li:nth-child(4n + 2) {
        --paper: #ffd4e2;
        --fold: #f0b3c6;
        transform: rotate(1.6deg);
      }

      .notes-list li:nth-child(4n + 3) {
        --paper: #d7f3ea;
        --fold: #b5e2d4;
        transform: rotate(-1deg);
      }

      .notes-list li:nth-child(4n) {
        --paper: #d7e6ff;
        --fold: #b7ccf0;
        transform: rotate(2deg);
      }

      .note-pic {

      .books-list li > div {

      }

      .copied.show {

      .box {

      .box-panel li button[aria-pressed="true"] {

  <body>
    <main
      class="room"
      aria-label="A painted room with a couch, a board, a mushroom lamp, a record player, a writing desk, a bookshelf, plants, and a ceiling light."
    >
      <div class="stage">
        <img
          class="bg"
          src="/art/casa-room.jpg"
          alt="A rose wall and a hardwood floor."
        />
        <img id="rug" class="piece away" src="/art/casa-rug.png" alt="A yellow floral rug." />
        <img id="garden" class="piece" src="/art/casa-garden-rug.png?v=3" alt="A garden rug with trees, animals, and flowers." />

        <img id="board" class="piece" src="/art/casa-board.png?v=3" alt="" role="button" tabindex="0" aria-haspopup="dialog" aria-controls="notes" aria-label="Board" />
        <img id="shelf" class="piece" src="/art/casa-shelf.png" alt="" role="button" tabindex="0" aria-haspopup="dialog" aria-controls="books" aria-label="Bookshelf" />

          <img src="/art/casa-notebook.png?v=2" alt="" />

        <img id="pen" class="piece" src="/art/casa-pen.png?v=2" alt="A turquoise pen." />

          <img class="lamp-off" src="/art/casa-lamp.png?v=3" alt="" />

      <span class="casa-cursor-glow"></span>
      <img class="cursor-off" src="/art/casa-lamp.png?v=3" alt="" />
      <img class="cursor-on" src="/art/casa-lamp-on.png?v=3" alt="" />
    </div>
    <script>
      const walls = {
        rose: {
          name: "Rose",
          src: "/art/casa-room.jpg",
          color: "#f24a81",
          alt: "A rose wall and a hardwood floor.",
        },
        seaglass: {
          name: "Sea glass",
          src: "/art/casa-room-seaglass.jpg",
          color: "#40c4b2",
          alt: "A sea glass wall and a hardwood floor.",
        },
        lilac: {
          name: "Lilac",
          src: "/art/casa-room-lilac.jpg",
          color: "#c48ce0",
          alt: "A lilac wall and a hardwood floor.",
        },
        apricot: {
          name: "Apricot",
          src: "/art/casa-room-apricot.jpg",
          color: "#ff9448",
          alt: "An apricot wall and a hardwood floor.",
        },
        lime: {
          name: "Lime",
          src: "/art/casa-room-lime.jpg",
          color: "#a8d23a",
          alt: "A lime wall and a hardwood floor.",
        },
      };

      const bg = document.querySelector(".bg");
      const nameEl = document.querySelector("#wall-name");
      const buttons = [...document.querySelectorAll("[data-wall]")];

      function apply(id) {
        const wall = walls[id] || walls.rose;
        const key = walls[id] ? id : "rose";
        document.documentElement.style.background = wall.color;
        document.body.style.background = wall.color;
        bg.src = wall.src;
        bg.alt = wall.alt;
        nameEl.textContent = wall.name;
        for (const button of buttons) {
          button.setAttribute("aria-pressed", button.dataset.wall === key ? "true" : "false");
        }
        try {
          localStorage.setItem("casa-wall", key);
        } catch (error) {}
      }

      for (const id of Object.keys(walls)) {
        const img = new Image();
        img.src = walls[id].src;
      }

      for (const button of buttons) {
        button.addEventListener("click", () => apply(button.dataset.wall));
      }

      let saved = "rose";
      try {
        saved = localStorage.getItem("casa-wall") || "rose";
      } catch (error) {}
      if (saved !== "rose") apply(saved);

      const stage = document.querySelector(".stage");
      const pieces = [...document.querySelectorAll(".piece")];
      const copied = document.querySelector(".copied");
      const light = document.getElementById("window");
      const flatPieces = new Set(["rug", "garden"]);
      const wallPieces = new Set(["window", "board"]);
      const smallPieces = new Set(["pen", "notebook", "glass", "green", "purple", "macbook", "pot", "coaster"]);
      let drag = null;
      let copiedTimer = 0;
      let shadowFrame = 0;

      function castShadow(piece) {
        if (!piece || wallPieces.has(piece.id) || flatPieces.has(piece.id)) {
          if (piece) piece.style.filter = "";
          return;
        }
        const box = stage.getBoundingClientRect();
        const lamp = light.getBoundingClientRect();
        const rect = piece.getBoundingClientRect();
        const lx = lamp.left + lamp.width * 0.5;
        const ly = lamp.top + lamp.height * 0.45;
        const px = rect.left + rect.width * 0.5;
        const py = rect.top + rect.height * 0.78;
        let dx = px - lx;
        let dy = py - ly;
        const dist = Math.hypot(dx, dy) || 1;
        let nx = dx / dist;
        let ny = Math.max(dy / dist, 0.55);
        const norm = Math.hypot(nx, ny) || 1;
        nx /= norm;
        ny /= norm;
        const far = Math.min(dist / box.width, 0.62);
        const reach = smallPieces.has(piece.id) ? 0.55 : 1;
        const unit = box.width / 100;
        const length = (0.7 + far * 2.6) * unit * reach;
        const blur = (0.35 + far * 1.15) * unit;
        const alpha = (0.22 + (1 - far) * 0.08).toFixed(2);
        if (piece.id === "sakura") {
          const near = (1.1 * unit).toFixed(1);
          const farGlow = (2.6 * unit).toFixed(1);
          piece.style.filter = `drop-shadow(0 0 ${near}px rgba(255, 220, 170, 0.5)) drop-shadow(0 0 ${farGlow}px rgba(255, 206, 150, 0.22))`;
          return;
        }
        let filter = `drop-shadow(${(nx * length).toFixed(1)}px ${(ny * length).toFixed(1)}px ${blur.toFixed(1)}px rgba(52, 44, 78, ${alpha}))`;
        if (piece.id === "lamp") {
          piece.style.filter = "";
          for (const img of piece.querySelectorAll("img")) img.style.filter = filter;
          return;
        }
        piece.style.filter = filter;
      }

      function castShadows() {
        for (const piece of pieces) castShadow(piece);
      }

      function scheduleShadows(piece) {
        window.cancelAnimationFrame(shadowFrame);
        shadowFrame = window.requestAnimationFrame(() => {
          castShadow(piece);
          if (piece.id === "window") castShadows();
        });
      }

      function layoutText() {
        const box = stage.getBoundingClientRect();
        return pieces
          .map((piece) => {
            const rect = piece.getBoundingClientRect();
            const left = ((rect.left - box.left) / box.width) * 100;
            const top = ((rect.top - box.top) / box.height) * 100;
            const width = (rect.width / box.width) * 100;
            const height = (rect.height / box.height) * 100;
            const num = (value) => `${Math.round(value * 10) / 10}%`;
            const away = piece.classList.contains("away") ? " away" : "";
            return `${piece.id}: left ${num(left)}, top ${num(top)}, width ${num(width)}, height ${num(height)}${away}`;
          })
          .join("\n");
      }

      function showCopied() {
        copied.classList.add("show");
        window.clearTimeout(copiedTimer);
        copiedTimer = window.setTimeout(() => copied.classList.remove("show"), 1400);
      }

      function copyLayout() {
        const text = layoutText();
        const area = document.createElement("textarea");
        area.value = text;
        area.setAttribute("readonly", "");
        area.style.position = "fixed";
        area.style.opacity = "0";
        document.body.appendChild(area);
        area.select();
        let ok = false;
        try {
          ok = document.execCommand("copy");
        } catch (error) {}
        area.remove();
        const finish = () => {
          if (ok) showCopied();
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(showCopied).catch(finish);
        } else {
          finish();
        }
      }

      function setLamp(on) {
        const lamp = document.getElementById("lamp");
        lamp.classList.toggle("lit", on);
        lamp.setAttribute("aria-pressed", on ? "true" : "false");
        try {
          localStorage.setItem("casa-lamp", on ? "on" : "off");
        } catch (error) {}
      }

      const lampButton = document.getElementById("lamp");
      lampButton.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" && event.key !== " ") return;
        event.preventDefault();
        setLamp(!lampButton.classList.contains("lit"));
      });

      try {
        if (localStorage.getItem("casa-lamp") === "on") setLamp(true);
      } catch (error) {}

      for (const piece of pieces) {
        piece.addEventListener("pointerdown", (event) => {
          if (event.button !== 0 || piece.classList.contains("away")) return;
          if (handheld()) {
            drag = {
              piece,
              moved: false,
              x: event.clientX,
              y: event.clientY,
              mobile: true,
            };
            if (room.clientWidth < room.clientHeight) {
              viewDrag = { id: event.pointerId, x: event.clientX, start: viewX };
            }
            try {
              piece.setPointerCapture(event.pointerId);
            } catch (error) {}
            return;
          }
          const box = stage.getBoundingClientRect();
          const rect = piece.getBoundingClientRect();
          piece.style.left = `${((rect.left - box.left) / box.width) * 100}%`;
          piece.style.top = `${((rect.top - box.top) / box.height) * 100}%`;
          piece.style.right = "auto";
          piece.style.bottom = "auto";
          piece.classList.add("dragging");
          try {
            piece.setPointerCapture(event.pointerId);
          } catch (error) {}
          drag = {
            piece,
            dx: event.clientX - rect.left,
            dy: event.clientY - rect.top,
            moved: false,
            x: event.clientX,
            y: event.clientY,
          };
        });

        piece.addEventListener("pointermove", (event) => {
          if (!drag || drag.piece !== piece) return;
          if (drag.mobile) {
            if (Math.hypot(event.clientX - drag.x, event.clientY - drag.y) > 3) drag.moved = true;
            if (viewDrag && viewDrag.id === event.pointerId) {
              viewX = viewDrag.start + (event.clientX - viewDrag.x);
              placeStage();
            }
            return;
          }
          if (Math.hypot(event.clientX - drag.x, event.clientY - drag.y) > 3) drag.moved = true;
          const box = stage.getBoundingClientRect();
          const width = piece.offsetWidth;
          const height = piece.offsetHeight;
          const min = 48;
          let x = event.clientX - box.left - drag.dx;
          let y = event.clientY - box.top - drag.dy;
          x = Math.min(Math.max(x, min - width), box.width - min);
          y = Math.min(Math.max(y, min - height), box.height - min);
          piece.style.left = `${(x / box.width) * 100}%`;
          piece.style.top = `${(y / box.height) * 100}%`;
          scheduleShadows(piece);
        });

        function endDrag(event) {
          if (!drag || drag.piece !== piece) return;
          piece.classList.remove("dragging");
          const moved = drag.moved;
          const mobile = drag.mobile;
          drag = null;
          if (viewDrag && event && viewDrag.id === event.pointerId) viewDrag = null;
          if (moved) piece.dataset.dragged = "1";
          if (piece.id === "lamp" && !moved) {
            setLamp(!piece.classList.contains("lit"));
            return;
          }
          if (piece.id === "macbook" && !moved) {
            window.location.href = "https://www.gliahq.com";
            return;
          }
          if (piece.id === "shelf" && !moved) {
            toggleBooks();
            return;
          }
          if (piece.id === "board" && !moved) {
            toggleNotes();
            return;
          }
          if (moved && !mobile) copyLayout();
        }

        piece.addEventListener("pointerup", endDrag);
        piece.addEventListener("pointercancel", endDrag);
      }

      const boxToggle = document.querySelector("#box-toggle");
      const boxPanel = document.querySelector("#box-panel");
      const pieceButtons = [...document.querySelectorAll("[data-piece]")];

      function setPiece(id, on) {
        const piece = document.getElementById(id);
        if (!piece) return;
        piece.classList.toggle("away", !on);
        const button = pieceButtons.find((item) => item.dataset.piece === id);
        if (button) button.setAttribute("aria-pressed", on ? "true" : "false");
      }

      function savePieces() {
        const away = pieceButtons
          .filter((button) => button.getAttribute("aria-pressed") !== "true")
          .map((button) => button.dataset.piece);
        try {
          localStorage.setItem("casa-away", away.join(","));
        } catch (error) {}
      }

      boxToggle.addEventListener("click", () => {
        const open = boxToggle.getAttribute("aria-expanded") === "true";
        boxToggle.setAttribute("aria-expanded", open ? "false" : "true");
        boxPanel.hidden = open;
      });

      for (const button of pieceButtons) {
        button.addEventListener("click", () => {
          const on = button.getAttribute("aria-pressed") !== "true";
          setPiece(button.dataset.piece, on);
          savePieces();
        });
      }

      try {
        const stored = localStorage.getItem("casa-away");
        if (stored !== null) {
          const away = new Set(stored.split(",").filter(Boolean));
          for (const button of pieceButtons) {
            setPiece(button.dataset.piece, !away.has(button.dataset.piece));
          }
        }
      } catch (error) {}

      const books = document.querySelector("#books");
      const booksList = document.querySelector("#books-list");
      const booksCount = document.querySelector("#books-count");
      const booksFind = document.querySelector("#books-find");
      const booksClose = document.querySelector("#books-close");
      const shelfButtons = [...document.querySelectorAll(".books-filters button")];
      const shelfPiece = document.getElementById("shelf");
      let library = null;
      let shelfFilter = "favorite";

      function coverSrc(book) {
        if (book.c) return `https://covers.openlibrary.org/b/id/${book.c}-M.jpg?default=false`;
        if (book.i) return `https://covers.openlibrary.org/b/isbn/${book.i}-M.jpg?default=false`;
        return "";
      }

      function drawBooks() {
        const query = booksFind.value.trim().toLowerCase();
        const matches = (library || []).filter((book) => {
          if (shelfFilter === "favorite" && !book.f) return false;
          if (shelfFilter === "loved" && (book.r || 0) < 4) return false;
          if (shelfFilter === "reading" && !book.n) return false;
          if (!query) return true;
          return `${book.t} ${book.a}`.toLowerCase().includes(query);
        });
        booksCount.textContent =
          matches.length === 0 ? "No books" : matches.length === 1 ? "1 book" : `${matches.length.toLocaleString()} books`;
        const fragment = document.createDocumentFragment();
        for (const book of matches) {
          const item = document.createElement("li");
          const cover = document.createElement("span");
          cover.className = "book-cover";
          const src = coverSrc(book);
          if (src) {
            const img = document.createElement("img");
            img.alt = "";
            img.loading = "lazy";
            img.decoding = "async";
            img.addEventListener("error", () => img.remove());
            img.src = src;
            cover.append(img);
          }
          const copy = document.createElement("div");
          const title = document.createElement("p");
          title.className = "book-title";
          title.textContent = book.t;
          const by = document.createElement("p");
          by.className = "book-by";
          by.textContent = book.a;
          copy.append(title, by);
          item.append(cover, copy);
          fragment.append(item);
        }
        booksList.replaceChildren(fragment);
      }

      async function openBooks() {
        books.hidden = false;
        if (!library) {
          booksCount.textContent = "Opening the shelf...";
          booksList.replaceChildren();
          try {
            const response = await fetch("/art/casa-books.json?v=3");
            if (!response.ok) throw new Error("shelf");
            library = await response.json();
          } catch (error) {
            booksCount.textContent = "The shelf did not open.";
            return;
          }
        }
        drawBooks();
        booksFind.focus();
      }

      function closeBooks() {
        books.hidden = true;
        shelfPiece.focus();
      }

      function toggleBooks() {
        if (books.hidden) openBooks();
        else closeBooks();
      }

      shelfPiece.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" && event.key !== " ") return;
        event.preventDefault();
        toggleBooks();
      });

      const notebook = document.getElementById("notebook");
      notebook.addEventListener("click", (event) => {
        if (notebook.dataset.dragged === "1") {
          event.preventDefault();
          delete notebook.dataset.dragged;
        }
      });
      notebook.addEventListener("keydown", (event) => {
        if (event.key !== " ") return;
        event.preventDefault();
        window.location.href = notebook.href;
      });

      document.getElementById("macbook").addEventListener("keydown", (event) => {
        if (event.key !== "Enter" && event.key !== " ") return;
        event.preventDefault();
        window.location.href = "https://www.gliahq.com";
      });

      booksClose.addEventListener("click", closeBooks);
      books.addEventListener("click", (event) => {
        if (event.target === books) closeBooks();
      });
      booksFind.addEventListener("input", () => {
        if (library) drawBooks();
      });
      for (const button of shelfButtons) {
        button.addEventListener("click", () => {
          shelfFilter = button.dataset.shelf;
          for (const item of shelfButtons) {
            item.setAttribute("aria-pressed", item === button ? "true" : "false");
          }
          if (library) drawBooks();
        });
      }
      document.addEventListener("keydown", (event) => {
        if (event.key !== "Escape") return;
        if (!notes.hidden) closeNotes();
        else if (!books.hidden) closeBooks();
      });

      const notes = document.querySelector("#notes");
      const notesList = document.querySelector("#notes-list");
      const notesForm = document.querySelector("#notes-form");
      const notesText = document.querySelector("#notes-text");
      const notesName = document.querySelector("#notes-name");
      const notesLink = document.querySelector("#notes-link");
      const notesStatus = document.querySelector("#notes-status");
      const notesClose = document.querySelector("#notes-close");
      const notesImage = document.querySelector("#notes-image");
      const notesDrop = document.querySelector("#notes-drop");
      const notesPreviewImg = document.querySelector("#notes-preview-img");
      const notesClear = document.querySelector("#notes-clear");
      const notesPin = document.querySelector("#notes-pin");
      const boardPiece = document.getElementById("board");
      let boardNotes = null;
      let pendingImage = "";
      let pictureTicket = 0;

      function safeLink(value) {
        if (!value || !/^https?:\/\//i.test(value)) return "";
        try {
          const url = new URL(value);
          if (url.protocol !== "http:" && url.protocol !== "https:") return "";
          return url.href;
        } catch (error) {
          return "";
        }
      }

      function safeImage(value) {
        if (!value || !/^https:\/\//i.test(value)) return "";
        try {
          const url = new URL(value);
          if (url.protocol !== "https:" || !url.hostname.endsWith(".blob.vercel-storage.com")) return "";
          return url.href;
        } catch (error) {
          return "";
        }
      }

      function clearPicture() {
        pendingImage = "";
        notesImage.value = "";
        notesPreviewImg.removeAttribute("src");
        notesDrop.classList.remove("has-picture");
        notesClear.hidden = true;
      }

      async function usePicture(file) {
        const ticket = ++pictureTicket;
        if (!file) {
          clearPicture();
          return;
        }
        const quick = URL.createObjectURL(file);
        notesPreviewImg.src = quick;
        notesDrop.classList.add("has-picture");
        notesClear.hidden = false;
        notesStatus.textContent = "Opening the picture...";
        try {
          const data = await preparePicture(file);
          if (ticket !== pictureTicket) return;
          pendingImage = data;
          notesPreviewImg.src = pendingImage;
          notesStatus.textContent = "";
        } catch (error) {
          if (ticket !== pictureTicket) return;
          clearPicture();
          notesStatus.textContent = "That picture doesn't open.";
        } finally {
          URL.revokeObjectURL(quick);
        }
      }

      function loadPicture(file) {
        return new Promise((resolve, reject) => {
          const url = URL.createObjectURL(file);
          const img = new Image();
          img.onload = () => {
            URL.revokeObjectURL(url);
            resolve(img);
          };
          img.onerror = () => {
            URL.revokeObjectURL(url);
            reject(new Error("picture"));
          };
          img.src = url;
        });
      }

      async function preparePicture(file) {
        const allowed = ["image/jpeg", "image/png", "image/webp", "image/gif"];
        if (!file || !allowed.includes(file.type)) throw new Error("picture");
        const img = await loadPicture(file);
        const max = 1200;
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const width = Math.max(1, Math.round(img.width * scale));
        const height = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", 0.82));
        if (!blob || blob.size > 900000) throw new Error("picture");
        const data = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(String(reader.result || ""));
          reader.onerror = () => reject(new Error("picture"));
          reader.readAsDataURL(blob);
        });
        if (!data.startsWith("data:image/jpeg")) throw new Error("picture");
        return data;
      }

      function drawNotes() {
        const fragment = document.createDocumentFragment();
        for (const note of boardNotes) {
          const item = document.createElement("li");
          const src = safeImage(note.image);
          if (src) {
            const img = document.createElement("img");
            img.className = "note-pic";
            img.alt = note.text ? "" : "A picture on the board";
            img.src = src;
            item.append(img);
          }
          if (note.text) {
            const text = document.createElement("p");
            text.className = "note-text";
            text.textContent = note.text;
            item.append(text);
          }
          const href = safeLink(note.link);
          if (note.name || href) {
            const by = document.createElement("p");
            by.className = "note-by";
            if (href) {
              const link = document.createElement("a");
              link.href = href;
              link.target = "_blank";
              link.rel = "noopener noreferrer";
              link.textContent = note.name || href.replace(/^https?:\/\//, "").replace(/\/$/, "");
              by.append(link);
            } else {
              by.textContent = note.name;
            }
            item.append(by);
          }
          fragment.append(item);
        }
        notesList.replaceChildren(fragment);
      }

      async function openNotes() {
        notes.hidden = false;
        notesStatus.textContent = "Opening the board...";
        notesList.replaceChildren();
        try {
          const response = await fetch("/api/board");
          if (!response.ok) throw new Error("board");
          const data = await response.json();
          if (data.ready === false) throw new Error("board");
          boardNotes = Array.isArray(data.notes) ? data.notes : [];
          notesStatus.textContent = "";
          drawNotes();
        } catch (error) {
          boardNotes = null;
          notesStatus.textContent = "The board did not open.";
        }
        notesText.focus();
      }

      function closeNotes() {
        notes.hidden = true;
        boardPiece.focus();
      }

      function toggleNotes() {
        if (notes.hidden) openNotes();
        else closeNotes();
      }

      boardPiece.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" && event.key !== " ") return;
        event.preventDefault();
        toggleNotes();
      });

      notesClose.addEventListener("click", closeNotes);
      notes.addEventListener("click", (event) => {
        if (event.target === notes || event.target.classList.contains("notes-board") || event.target.classList.contains("notes-card")) {
          closeNotes();
        }
      });
      notesForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const text = notesText.value.trim();
        if (!boardNotes) {
          notesStatus.textContent = "The board did not open.";
          return;
        }
        if (!text && !pendingImage) {
          notesStatus.textContent = "The note is empty.";
          return;
        }
        notesPin.disabled = true;
        notesStatus.textContent = "Pinning...";
        try {
          const response = await fetch("/api/board", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              kind: "note",
              text,
              name: notesName.value.trim(),
              link: notesLink.value.trim(),
              image: pendingImage,
              company: document.querySelector("#notes-company").value,
            }),
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) {
            notesStatus.textContent = data.error || "That one didn't pin.";
            return;
          }
          boardNotes = Array.isArray(data.notes) ? data.notes : boardNotes;
          notesText.value = "";
          notesName.value = "";
          notesLink.value = "";
          clearPicture();
          notesStatus.textContent = "Pinned.";
          drawNotes();
        } catch (error) {
          notesStatus.textContent = "That one didn't pin.";
        } finally {
          notesPin.disabled = false;
        }
      });

      notesImage.addEventListener("change", () => {
        usePicture(notesImage.files && notesImage.files[0]);
      });
      notesDrop.addEventListener("dragover", (event) => {
        event.preventDefault();
        notesDrop.classList.add("over");
      });
      notesDrop.addEventListener("dragleave", (event) => {
        if (notesDrop.contains(event.relatedTarget)) return;
        notesDrop.classList.remove("over");
      });
      notesDrop.addEventListener("drop", (event) => {
        event.preventDefault();
        notesDrop.classList.remove("over");
        const file = event.dataTransfer && event.dataTransfer.files && event.dataTransfer.files[0];
        usePicture(file);
      });

      notesClear.addEventListener("click", () => {
        clearPicture();
      });

      const room = document.querySelector(".room");
      let viewX = null;
      let viewDrag = null;

      function handheld() {
        return Math.min(window.innerWidth, window.innerHeight) <= 820;
      }

      function placeStage() {
        if (!handheld()) {
          stage.style.left = "";
          stage.style.top = "";
          stage.style.width = "";
          stage.style.height = "";
          stage.style.transform = "";
          return;
        }
        const w = room.clientWidth;
        const h = room.clientHeight;
        const horizontal = w >= h;
        let stageW;
        let stageH;
        let x;
        let y;
        if (horizontal) {
          const scale = Math.min(w / 16, h / 9);
          stageW = scale * 16;
          stageH = scale * 9;
          x = (w - stageW) / 2;
          y = (h - stageH) / 2;
        } else {
          stageH = h;
          stageW = (h * 16) / 9;
          y = 0;
          const min = Math.min(0, w - stageW);
          if (viewX == null) viewX = (w - stageW) / 2;
          viewX = Math.min(0, Math.max(min, viewX));
          x = viewX;
        }
        stage.style.left = "0px";
        stage.style.top = "0px";
        stage.style.width = `${stageW}px`;
        stage.style.height = `${stageH}px`;
        stage.style.transform = `translate(${x}px, ${y}px)`;
      }

      room.addEventListener("pointerdown", (event) => {
        if (event.button !== 0 || !handheld() || room.clientWidth >= room.clientHeight) return;
        if (event.target.closest(".piece")) return;
        viewDrag = { id: event.pointerId, x: event.clientX, start: viewX };
        try {
          room.setPointerCapture(event.pointerId);
        } catch (error) {}
      });

      room.addEventListener("pointermove", (event) => {
        if (!viewDrag || viewDrag.id !== event.pointerId) return;
        viewX = viewDrag.start + (event.clientX - viewDrag.x);
        placeStage();
      });

      function endView(event) {
        if (!viewDrag || viewDrag.id !== event.pointerId) return;
        viewDrag = null;
      }

      room.addEventListener("pointerup", endView);
      room.addEventListener("pointercancel", endView);

      function layoutRoom() {
        placeStage();
        castShadows();
      }

      layoutRoom();
      window.addEventListener("resize", layoutRoom);
      window.addEventListener("load", layoutRoom);

      const casaCursor = document.querySelector("#casa-cursor");
      const finePointer = window.matchMedia("(hover: hover) and (pointer: fine)");

      function moveCursor(event) {
        if (!finePointer.matches || event.pointerType === "touch") {
          casaCursor.hidden = true;
          document.documentElement.classList.remove("has-cursor");
          return;
        }
        document.documentElement.classList.add("has-cursor");
        const typing = event.target.closest("input, textarea");
        casaCursor.hidden = Boolean(typing);
        casaCursor.classList.toggle("lit", !typing && Boolean(event.target.closest("button, a, [role='button'], [role='link']")));
        casaCursor.style.transform = `translate(${event.clientX}px, ${event.clientY}px)`;
      }

      window.addEventListener("pointermove", moveCursor);
      document.documentElement.addEventListener("pointerleave", () => {
        casaCursor.hidden = true;
      });
    </script>
  </body>
</html>
