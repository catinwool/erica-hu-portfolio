<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>casa</title>
    <meta name="description" content="A lamp, a shelf, a record, and a board." />
    <meta name="theme-color" content="#f3e6d4" />
    <meta property="og:title" content="casa" />
    <meta property="og:description" content="A lamp, a shelf, a record, and a board." />
    <meta property="og:url" content="https://casa.erica-hu.com" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23241c14'/%3E%3Cpath d='M4 20 Q6 8 16 6 Q26 8 28 20 Q16 16 4 20' fill='%23c4453a'/%3E%3Ccircle cx='11' cy='14' r='2' fill='%23f6efe6'/%3E%3Ccircle cx='18' cy='12' r='1.6' fill='%23f6efe6'/%3E%3Cpath d='M13 19 Q12 26 16 27 Q20 26 19 19' fill='%23f3e6d4'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,200..720;1,7..72,200..720&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        color: #241c14;
        background: #f3e6d4;
        font-family: "Literata", Georgia, "Palatino Linotype", Palatino, serif;
        font-optical-sizing: auto;
        color-scheme: light;
      }

      body[data-lamp="off"] {
        color: #f6efe6;
        background: #14110f;
        color-scheme: dark;
      }

      ::selection {
        background: #e6c9a8;
        color: #241c14;
      }

      :focus {
        outline: none;
      }

      :focus-visible {
        outline: 2px solid #c4453a;
        outline-offset: 3px;
      }

      .wrap {
        width: min(860px, 100%);
        margin: 0 auto;
        padding: clamp(1.4rem, 4vw, 2.4rem) 1.1rem 2rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.6rem;
      }

      header,
      footer {
        text-align: center;
      }

      h1 {
        margin: 0;
        font-weight: 500;
        font-style: italic;
        font-size: clamp(3rem, 9vw, 4.8rem);
        letter-spacing: -0.045em;
        line-height: 0.85;
      }

      #line {
        margin: 0.75rem 0 0;
        font-size: 1.12rem;
      }

      main {
        width: 100%;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2.4rem 1.5rem;
      }

      .spot {
        display: flex;
        flex-direction: column;
        align-items: center;
        min-width: 0;
      }

      .name {
        margin: 0.85rem 0 0;
        font-style: italic;
        font-size: 1.05rem;
        opacity: 0.62;
      }

      .corner {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        gap: 0.75rem;
        flex-wrap: wrap;
      }

      .sleeves {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
      }

      .sleeve {
        width: 4.6rem;
        height: 4.6rem;
        border: 0;
        border-radius: 3px;
        color: #f6efe6;
        font: inherit;
        font-size: 0.82rem;
        line-height: 1.15;
        text-align: left;
        padding: 0.4rem 0.45rem;
        cursor: pointer;
      }

      .sleeve[aria-pressed="true"] {
        box-shadow: inset 0 0 0 2px #f6efe6;
      }

      .player {
        position: relative;
        width: 220px;
        height: 220px;
        background: #6e412b;
        border-radius: 14px;
        box-shadow: inset 0 0 0 8px #5a3422;
      }

      .platter {
        position: absolute;
        left: 16px;
        top: 16px;
        width: 188px;
        height: 188px;
        border: 0;
        border-radius: 50%;
        padding: 0;
        background: radial-gradient(circle, #d9d2ca 60%, #9a938c 63% 100%);
        display: grid;
        place-items: center;
        cursor: pointer;
      }

      .disc {
        width: 168px;
        height: 168px;
        border-radius: 50%;
        background:
          radial-gradient(circle at 50% 50%, transparent 0 22%, #111 23% 100%),
          repeating-radial-gradient(circle at 50% 50%, #1a1a1a 0 1px, #2c2c2c 2px 3px);
        display: grid;
        place-items: center;
      }

      .disc.spin {
        animation: spin 1.8s linear infinite;
      }

      .disc-label {
        width: 58px;
        height: 58px;
        border-radius: 50%;
        background: #c4453a;
        color: #fffaf3;
        font-size: 0.68rem;
        line-height: 1.15;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 0.3rem;
      }

      .arm {
        position: absolute;
        z-index: 2;
        right: 28px;
        top: 22px;
        width: 7px;
        height: 108px;
        border-radius: 6px;
        background: linear-gradient(#f4efe8, #b7b1a8);
        transform-origin: 50% 8px;
        transform: rotate(-36deg);
        transition: transform 0.45s ease;
        pointer-events: none;
      }

      .arm::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 2px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #d8d2cb;
        transform: translateX(-50%);
        box-shadow: 0 0 0 3px #5a3422;
      }

      .arm::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: 0;
        width: 14px;
        height: 18px;
        border-radius: 2px;
        background: #2a2420;
        transform: translateX(-50%);
      }

      .player.on .arm {
        transform: rotate(16deg);
      }

      .case {
        width: min(100%, 320px);
        background: #8d5a3c;
        border-radius: 4px;
        padding: 12px 10px 0;
        box-shadow: inset 0 0 0 8px #6e412b;
        min-height: 150px;
      }

      .shelf-row {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        min-height: 128px;
        border-bottom: 10px solid #6e412b;
        padding: 0 4px;
      }

      .spine {
        width: 42px;
        height: 116px;
        border: 0;
        border-radius: 2px 2px 0 0;
        color: #fffaf3;
        font: inherit;
        font-size: 0.72rem;
        padding: 0.4rem 0.15rem;
        cursor: pointer;
        display: flex;
        align-items: flex-start;
        justify-content: center;
      }

      .spine span {
        writing-mode: vertical-rl;
        white-space: nowrap;
        max-height: 100px;
        overflow: hidden;
      }

      .empty {
        margin: 0;
        padding: 2.2rem 0.6rem 1.6rem;
        text-align: center;
        color: #f6efe6;
      }

      .cork .empty {
        color: #3a2a16;
        padding: 1.4rem 0.4rem;
      }

      form {
        width: min(100%, 320px);
        display: flex;
        flex-direction: column;
        gap: 0.45rem;
        margin-top: 0.75rem;
      }

      input,
      textarea {
        font: inherit;
        font-size: 1rem;
        color: #241c14;
        background: #fffaf3;
        border: 1px solid rgba(36, 28, 20, 0.2);
        border-radius: 8px;
        padding: 0.55rem 0.7rem;
      }

      textarea {
        min-height: 5.4rem;
        resize: vertical;
      }

      body[data-lamp="off"] input,
      body[data-lamp="off"] textarea {
        color: #f6efe6;
        background: #2a2420;
        border-color: rgba(246, 239, 230, 0.22);
      }

      .go {
        font: inherit;
        font-size: 1rem;
        border: 0;
        border-radius: 999px;
        padding: 0.55rem 0.95rem;
        background: #241c14;
        color: #f6efe6;
        cursor: pointer;
      }

      body[data-lamp="off"] .go {
        background: #f6efe6;
        color: #241c14;
      }

      .go:disabled {
        opacity: 0.55;
        cursor: default;
      }

      .trap {
        position: absolute;
        left: -9999px;
        width: 1px;
        height: 1px;
        overflow: hidden;
      }

      .lamp-spot {
        position: relative;
      }

      .lamp-spot::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 42%;
        width: 280px;
        height: 280px;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, rgba(255, 186, 92, 0.5), transparent 68%);
        pointer-events: none;
        transition: opacity 0.35s ease;
      }

      body[data-lamp="off"] .lamp-spot::before {
        opacity: 0;
      }

      .lamp {
        position: relative;
        z-index: 1;
        width: min(220px, 70vw);
        height: auto;
        border: 0;
        padding: 0;
        background: transparent;
        cursor: pointer;
        display: block;
      }

      .cap {
        fill: #c4453a;
      }

      .spot-mark {
        fill: #f7f1e8;
      }

      .gill {
        fill: #f6efe8;
      }

      .stem {
        fill: #f4e7d4;
      }

      .base {
        fill: #c4a574;
      }

      .glow {
        fill: #ffb45a;
        opacity: 0.9;
      }

      body[data-lamp="off"] .cap {
        fill: #6a302c;
      }

      body[data-lamp="off"] .glow {
        opacity: 0;
      }

      body[data-lamp="off"] .stem,
      body[data-lamp="off"] .gill {
        fill: #c8b8a4;
      }

      .cork {
        width: min(100%, 320px);
        background-color: #c6a36a;
        background-image: radial-gradient(rgba(80, 52, 18, 0.09) 0.8px, transparent 0.9px);
        background-size: 7px 7px;
        border-radius: 8px;
        min-height: 140px;
        padding: 0.75rem;
        display: flex;
        flex-direction: column;
        gap: 0.65rem;
      }

      .note {
        position: relative;
        background: #fffaf3;
        color: #241c14;
        padding: 1rem 0.75rem 0.55rem;
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.06);
      }

      .note::before {
        content: "";
        position: absolute;
        top: 5px;
        left: 50%;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #c4453a;
        transform: translateX(-50%);
      }

      .note p {
        margin: 0;
      }

      .meta {
        margin-top: 0.35rem;
        font-size: 0.82rem;
        opacity: 0.62;
      }

      .quiet {
        margin: 0.35rem 0 0;
        font-size: 0.86rem;
        opacity: 0.62;
        text-align: center;
      }

      footer {
        margin-top: 0.4rem;
      }

      footer a {
        color: inherit;
        opacity: 0.62;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 720px) {
        main {
          grid-template-columns: 1fr;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .disc.spin,
        .arm,
        .lamp-spot::before {
          animation: none;
          transition: none;
        }
      }
    </style>
  </head>
  <body data-lamp="on">
    <div class="wrap">
      <header>
        <h1>casa</h1>
        <p id="line">The lamp is already on.</p>
      </header>
      <main>
        <section class="spot" aria-label="Vinyl">
          <div class="corner">
            <div class="sleeves" id="sleeves"></div>
            <div class="player" id="player">
              <button type="button" class="platter" id="platter" aria-label="Turntable. Pick a record.">
                <span class="disc" id="disc">
                  <span class="disc-label" id="disc-label"></span>
                </span>
              </button>
              <span class="arm" aria-hidden="true"></span>
            </div>
          </div>
          <p class="name">vinyl</p>
        </section>

        <section class="spot" aria-label="Bookshelf">
          <div class="case" id="case">
            <p class="empty">The shelf is clear.</p>
          </div>
          <p class="name">shelf</p>
          <form id="book-form">
            <input class="trap" tabindex="-1" autocomplete="off" name="company" aria-hidden="true" />
            <input name="title" required maxlength="80" placeholder="Title" aria-label="Title" />
            <input name="author" maxlength="60" placeholder="Who wrote it" aria-label="Who wrote it" />
            <button class="go" type="submit">Put it on the shelf</button>
          </form>
        </section>

        <section class="spot lamp-spot" aria-label="Mushroom lamp">
          <button type="button" class="lamp" id="lamp" aria-pressed="true" aria-label="Mushroom lamp">
            <svg viewBox="0 0 200 250" role="img" aria-hidden="true">
              <ellipse class="glow" cx="100" cy="168" rx="78" ry="28" />
              <ellipse class="base" cx="100" cy="228" rx="34" ry="8" />
              <rect class="base" x="90" y="210" width="20" height="18" rx="3" />
              <path class="stem" d="M78 156 Q72 196 76 214 H124 Q128 196 122 156 Z" />
              <path class="gill" d="M28 132 Q100 176 172 132 Q100 154 28 132 Z" />
              <path class="cap" d="M16 124 Q28 36 100 24 Q172 36 184 124 Q100 100 16 124 Z" />
              <ellipse class="spot-mark" cx="62" cy="78" rx="11" ry="8" />
              <ellipse class="spot-mark" cx="104" cy="60" rx="8" ry="6" />
              <ellipse class="spot-mark" cx="142" cy="86" rx="10" ry="7" />
              <ellipse class="spot-mark" cx="88" cy="98" rx="6" ry="5" />
              <ellipse class="spot-mark" cx="126" cy="108" rx="5" ry="4" />
            </svg>
          </button>
          <p class="name">lamp</p>
        </section>

        <section class="spot" aria-label="Board">
          <div class="cork" id="notes">
            <p class="empty">The board is clear.</p>
          </div>
          <p class="name">board</p>
          <form id="note-form">
            <input class="trap" tabindex="-1" autocomplete="off" name="company" aria-hidden="true" />
            <textarea name="text" required maxlength="240" placeholder="A note for Erica" aria-label="A note for Erica"></textarea>
            <input name="name" maxlength="32" placeholder="Your name, if you want" aria-label="Your name" />
            <button class="go" type="submit">Pin it</button>
          </form>
          <p class="quiet">Notes stay on the board.</p>
        </section>
      </main>
      <footer>
        <a href="https://portfolio.erica-hu.com">portfolio</a>
      </footer>
    </div>
    <script>
      const RECORDS = [
        {
          id: "window",
          title: "Window",
          hue: "#8f3b28",
          tempo: 76,
          notes: [
            [64, 1], [67, 1], [69, 1.5], [67, 0.5],
            [72, 1], [71, 1], [67, 1], [64, 1],
            [65, 1], [64, 1], [62, 1], [60, 1],
            [62, 2], [60, 2]
          ],
          bass: [
            [48, 4], [48, 4], [53, 4], [48, 4]
          ]
        },
        {
          id: "late",
          title: "Late",
          hue: "#243044",
          tempo: 66,
          notes: [
            [69, 1], [72, 1], [76, 2],
            [74, 1], [72, 1], [71, 1], [69, 1],
            [67, 1], [69, 1], [72, 2],
            [76, 1], [74, 1], [72, 1], [69, 1]
          ],
          bass: [
            [45, 4], [45, 4], [41, 4], [45, 4]
          ]
        },
        {
          id: "kettle",
          title: "Kettle",
          hue: "#3e5c45",
          tempo: 104,
          notes: [
            [69, 0.5], [72, 0.5], [69, 0.5], [65, 0.5],
            [67, 0.5], [69, 0.5], [70, 0.5], [69, 0.5],
            [72, 1], [69, 1], [67, 1], [65, 1],
            [64, 0.5], [65, 0.5], [67, 1], [69, 1],
            [67, 0.5], [65, 0.5], [65, 2], [60, 2]
          ],
          bass: [
            [41, 4], [48, 4], [46, 4], [41, 4]
          ]
        }
      ];

      const line = document.getElementById("line");
      const sleeves = document.getElementById("sleeves");
      const player = document.getElementById("player");
      const platter = document.getElementById("platter");
      const disc = document.getElementById("disc");
      const discLabel = document.getElementById("disc-label");
      const lamp = document.getElementById("lamp");
      const caseEl = document.getElementById("case");
      const notesEl = document.getElementById("notes");
      const bookForm = document.getElementById("book-form");
      const noteForm = document.getElementById("note-form");
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      let audioCtx = null;
      let master = null;
      let generation = 0;
      let liveNodes = [];
      let nextTimer = null;
      let playingId = null;

      function say(text) {
        line.textContent = text;
      }

      function midi(note) {
        return 440 * Math.pow(2, (note - 69) / 12);
      }

      function stopMusic() {
        generation += 1;
        clearTimeout(nextTimer);
        liveNodes.forEach((node) => {
          try {
            node.stop();
          } catch (error) {
            /* already stopped */
          }
        });
        liveNodes = [];
        playingId = null;
        player.classList.remove("on");
        disc.classList.remove("spin");
        discLabel.textContent = "";
        platter.setAttribute("aria-label", "Turntable. Pick a record.");
        sleeves.querySelectorAll(".sleeve").forEach((button) => button.setAttribute("aria-pressed", "false"));
      }

      function tone(ctx, frequency, when, duration, amount) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const filter = ctx.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.value = 1200;
        osc.type = "triangle";
        osc.frequency.value = frequency;
        gain.gain.setValueAtTime(0.0001, when);
        gain.gain.exponentialRampToValueAtTime(amount, when + 0.03);
        gain.gain.setValueAtTime(amount, when + Math.max(0.05, duration - 0.06));
        gain.gain.exponentialRampToValueAtTime(0.0001, when + duration);
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(master);
        osc.start(when);
        osc.stop(when + duration + 0.02);
        liveNodes.push(osc);
      }

      function playLoop(ctx, record, when, gen) {
        if (gen !== generation) return;
        const beat = 60 / record.tempo;
        let melodyAt = when;
        record.notes.forEach(([note, beats]) => {
          const duration = beats * beat;
          tone(ctx, midi(note), melodyAt, duration * 0.95, 0.07);
          melodyAt += duration;
        });
        let bassAt = when;
        record.bass.forEach(([note, beats]) => {
          const duration = beats * beat;
          tone(ctx, midi(note), bassAt, duration * 0.9, 0.045);
          bassAt += duration;
        });
        const loop = melodyAt - when;
        const wait = Math.max(40, (when + loop - ctx.currentTime - 0.35) * 1000);
        nextTimer = setTimeout(() => playLoop(ctx, record, when + loop, gen), wait);
      }

      function playRecord(record) {
        if (playingId === record.id) {
          stopMusic();
          say("The needle is up.");
          return;
        }
        stopMusic();
        const ctx = audioCtx || (audioCtx = new AudioContext());
        if (!master) {
          master = ctx.createGain();
          master.gain.value = 0.9;
          master.connect(ctx.destination);
        }
        ctx.resume();
        playingId = record.id;
        player.classList.add("on");
        if (!reduceMotion) disc.classList.add("spin");
        discLabel.textContent = record.title;
        platter.setAttribute("aria-label", "Lift the needle. " + record.title + " is playing.");
        sleeves.querySelectorAll(".sleeve").forEach((button) => {
          button.setAttribute("aria-pressed", button.dataset.id === record.id ? "true" : "false");
        });
        const gen = generation;
        playLoop(ctx, record, ctx.currentTime + 0.06, gen);
        say(record.title + " is spinning.");
      }

      RECORDS.forEach((record) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "sleeve";
        button.dataset.id = record.id;
        button.style.background = record.hue;
        button.textContent = record.title;
        button.setAttribute("aria-pressed", "false");
        button.setAttribute("aria-label", "Play " + record.title);
        button.addEventListener("click", () => playRecord(record));
        sleeves.appendChild(button);
      });

      platter.addEventListener("click", () => {
        if (!playingId) {
          say("Pick a record.");
          return;
        }
        stopMusic();
        say("The needle is up.");
      });

      function setLamp(on) {
        document.body.dataset.lamp = on ? "on" : "off";
        lamp.setAttribute("aria-pressed", String(on));
        try {
          localStorage.setItem("casa-lamp", on ? "on" : "off");
        } catch (error) {
          /* private mode */
        }
      }

      lamp.addEventListener("click", () => {
        const on = document.body.dataset.lamp !== "on";
        setLamp(on);
        say(on ? "The mushroom lamp is on." : "The mushroom lamp is off.");
      });

      try {
        if (localStorage.getItem("casa-lamp") === "off") {
          setLamp(false);
          say("The lamp is off.");
        }
      } catch (error) {
        /* private mode */
      }

      function shortDate(iso) {
        const date = new Date(iso);
        if (Number.isNaN(date.getTime())) return "";
        return date.toLocaleDateString("en-GB", { day: "numeric", month: "short" });
      }

      function renderBooks(books) {
        caseEl.replaceChildren();
        if (!books.length) {
          const empty = document.createElement("p");
          empty.className = "empty";
          empty.textContent = "The shelf is clear.";
          caseEl.appendChild(empty);
          return;
        }
        const per = 4;
        const rows = Math.ceil(books.length / per);
        for (let row = 0; row < rows; row += 1) {
          const shelf = document.createElement("div");
          shelf.className = "shelf-row";
          books.slice(row * per, row * per + per).forEach((book) => {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "spine";
            button.style.background = book.hue || "#8f3b28";
            const label = book.author ? book.title + ". " + book.author + "." : book.title + ".";
            button.setAttribute("aria-label", label);
            button.addEventListener("click", () => say(label));
            const span = document.createElement("span");
            span.textContent = book.title;
            button.appendChild(span);
            shelf.appendChild(button);
          });
          caseEl.appendChild(shelf);
        }
      }

      function renderNotes(notes) {
        notesEl.replaceChildren();
        if (!notes.length) {
          const empty = document.createElement("p");
          empty.className = "empty";
          empty.textContent = "The board is clear.";
          notesEl.appendChild(empty);
          return;
        }
        notes.forEach((note, index) => {
          const card = document.createElement("article");
          card.className = "note";
          if (!reduceMotion) {
            const tilt = (index % 5) - 2;
            card.style.transform = "rotate(" + tilt + "deg)";
          }
          const text = document.createElement("p");
          text.textContent = note.text;
          const meta = document.createElement("p");
          meta.className = "meta";
          meta.textContent = [note.name, shortDate(note.at)].filter(Boolean).join(", ");
          card.append(text, meta);
          notesEl.appendChild(card);
        });
      }

      async function post(body) {
        const response = await fetch("/api/board", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || "Not just now.");
        return data;
      }

      bookForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const button = bookForm.querySelector(".go");
        const payload = {
          kind: "book",
          title: bookForm.title.value,
          author: bookForm.author.value,
          company: bookForm.company.value,
        };
        button.disabled = true;
        try {
          const data = await post(payload);
          if (data.books) renderBooks(data.books);
          bookForm.title.value = "";
          bookForm.author.value = "";
          say("It's on the shelf.");
        } catch (error) {
          say(error.message || "Not just now.");
        } finally {
          button.disabled = false;
        }
      });

      noteForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const button = noteForm.querySelector(".go");
        const payload = {
          kind: "note",
          text: noteForm.text.value,
          name: noteForm.name.value,
          company: noteForm.company.value,
        };
        button.disabled = true;
        try {
          const data = await post(payload);
          if (data.notes) renderNotes(data.notes);
          noteForm.text.value = "";
          noteForm.name.value = "";
          say("It's on the board.");
        } catch (error) {
          say(error.message || "Not just now.");
        } finally {
          button.disabled = false;
        }
      });

      fetch("/api/board")
        .then((response) => response.json())
        .then((data) => {
          renderBooks(data.books || []);
          renderNotes(data.notes || []);
        })
        .catch(() => {
          /* the shelf and board already say they are clear */
        });
    </script>
  </body>
</html>
