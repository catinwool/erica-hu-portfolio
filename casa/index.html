    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        color: var(--ink);
        font-family: "Literata", Georgia, "Palatino Linotype", Palatino, serif;
        font-optical-sizing: auto;
      }

      body[data-sky="dusk"] {
        --ink: #f6efe6;
        color-scheme: dark;
        background:
          radial-gradient(ellipse 80% 48% at 50% -8%, #534864 0%, transparent 58%),
          radial-gradient(ellipse 74% 42% at 50% 112%, rgba(143, 59, 40, 0.5), transparent 52%),
          #241c28;
      }

      body[data-sky="day"] {
        --ink: #241c14;
        color-scheme: light;
        background:
          radial-gradient(ellipse 90% 50% at 50% 100%, rgba(255, 255, 255, 0.55), transparent 46%),
          linear-gradient(#eef3f8, #c5d4e4);
      }

      body[data-sky="night"] {
        --ink: #f4efe6;
        color-scheme: dark;
        background:
          radial-gradient(ellipse 70% 36% at 50% 0%, #1c2748 0%, transparent 62%),
          #090b12;
      }

      ::selection {
        background: #e6c9a8;
        color: #241c14;
      }

      .wrap {
        width: min(860px, 100%);
        min-height: 100dvh;
        margin: 0 auto;
        padding: clamp(1rem, 3vw, 1.75rem) 1rem 1.4rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.65rem;
      }

      main {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      header,
      footer {
        text-align: center;
      }

      h1 {
        margin: 0;
        font-weight: 500;
        font-style: italic;
        font-size: clamp(2.7rem, 8vw, 4.4rem);
        letter-spacing: -0.045em;
        line-height: 0.85;
      }

      .hint,
      .sr {
        margin: 0.4rem 0 0;
        font-size: 1.02rem;
        opacity: 0.72;
      }

      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }

      .house {
        width: 100%;
        height: auto;
        display: block;
        overflow: visible;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        filter: drop-shadow(0 22px 28px rgba(0, 0, 0, 0.28));
      }

      .hit {
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      .hit:focus {
        outline: none;
      }

      .ring {
        opacity: 0;
        pointer-events: none;
      }

      .hit:focus-visible .ring {
        opacity: 1;
      }

      .stars,
      .moon {
        opacity: 0;
        transition: opacity 0.6s ease;
        pointer-events: none;
      }

      .house[data-sky="night"] .stars,
      .house[data-sky="night"] .moon {
        opacity: 1;
      }

      .house[data-sky="dusk"] .moon {
        opacity: 0.8;
      }

      .lamp-glow {
        opacity: 0.5;
        transition: opacity 0.45s ease;
        pointer-events: none;
      }

      .house[data-sky="night"][data-lamp="on"] .lamp-glow {
        opacity: 0.85;
      }

      .house[data-lamp="off"] .lamp-glow {
        opacity: 0;
      }

      .house[data-lamp="off"] .shade {
        fill: #cbb98a;
      }

      .house[data-lamp="off"] .bulb {
        fill: #cfc6b8;
      }

      .study-shade {
        fill: #14110e;
        opacity: 0;
        transition: opacity 0.5s ease;
        pointer-events: none;
      }

      .house[data-lamp="off"] .study-shade {
        opacity: 0.7;
      }

      .book {
        transition: transform 0.28s ease;
      }

      .house[data-book="0"] .book-0,
      .house[data-book="1"] .book-1,
      .house[data-book="2"] .book-2 {
        transform: translateY(-14px);
      }

      .cat {
        transition: transform 0.7s cubic-bezier(0.18, 0.85, 0.2, 1);
      }

      .house[data-cat="sill"] .cat {
        transform: translate(108px, -46px);
      }

      .tail {
        transform-box: fill-box;
        transform-origin: 0% 80%;
        animation: wag 2.8s ease-in-out infinite;
      }

      .leaf {
        transform-box: fill-box;
        transform-origin: center;
        animation: sway 3.6s ease-in-out infinite;
      }

      .leaf-top {
        animation-delay: -1.1s;
      }

      .flower {
        opacity: 0;
        transform: scale(0.4);
        transform-box: fill-box;
        transform-origin: center;
        transition: opacity 0.35s ease, transform 0.35s ease;
      }

      .house.is-bloom .flower {
        opacity: 1;
        transform: scale(1);
      }

      .steam,
      .chimney-smoke {
        opacity: 0;
        pointer-events: none;
      }

      .house.is-boiling .steam,
      .house.is-boiling .chimney-smoke {
        animation: puff 1.6s ease-out infinite;
      }

      .steam-2,
      .smoke-2 {
        animation-delay: 0.35s;
      }

      .steam-3,
      .smoke-3 {
        animation-delay: 0.7s;
      }

      .house.is-boiling .kettle-body {
        fill: #eef3f8;
      }

      .dial {
        transform-box: fill-box;
        transform-origin: center;
        transition: transform 0.35s ease;
      }

      .house[data-station="off"] .dial {
        transform: rotate(-68deg);
      }

      .house[data-station="0"] .dial {
        transform: rotate(-42deg);
      }

      .house[data-station="1"] .dial {
        transform: rotate(-8deg);
      }

      .house[data-station="2"] .dial {
        transform: rotate(24deg);
      }

      .house[data-station="3"] .dial {
        transform: rotate(56deg);
      }

      .house.is-playing .speaker {
        transform-box: fill-box;
        transform-origin: center;
        animation: pulse 0.7s ease;
      }

      .door-void {
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .house.is-open .door-void {
        opacity: 1;
      }

      .door-panel {
        transition: transform 0.45s ease;
      }

      .house.is-open .door-panel {
        transform: translate(26px, 0);
      }

      .photo-front,
      .photo-back {
        transition: opacity 0.3s ease;
      }

      .photo-back {
        opacity: 0;
      }

      .house[data-photo="back"] .photo-front {
        opacity: 0;
      }

      .house[data-photo="back"] .photo-back {
        opacity: 1;
      }

      .photo-back text,
      .mat-word {
        font-family: "Literata", Georgia, serif;
        font-style: italic;
      }

      .caption {
        margin: 0.15rem 0 0;
        max-width: 26rem;
        min-height: 4.5rem;
        text-align: center;
        text-wrap: balance;
        font-style: italic;
        font-size: clamp(1.14rem, 2.5vw, 1.38rem);
        line-height: 1.35;
        transition: opacity 0.16s ease;
      }

      .caption.is-out {
        opacity: 0;
      }

      footer {
        margin-top: 0.15rem;
        font-size: 0.98rem;
      }

      footer a {
        color: inherit;
        opacity: 0.62;
        text-underline-offset: 0.22em;
      }

      footer a:hover {
        opacity: 1;
        color: #e7b15a;
      }

      body[data-sky="day"] footer a:hover {
        color: #8f3b28;
      }

      a:focus-visible {
        outline: 2px solid #e7b15a;
        outline-offset: 4px;
      }

      @keyframes sway {
        0%,
        100% {
          transform: rotate(0deg);
        }
        50% {
          transform: rotate(6deg);
        }
      }

      @keyframes wag {
        0%,
        100% {
          transform: rotate(0deg);
        }
        50% {
          transform: rotate(8deg);
        }
      }

      @keyframes puff {
        0% {
          transform: translateY(0);
          opacity: 0;
        }
        25% {
          opacity: 0.75;
        }
        100% {
          transform: translateY(-28px);
          opacity: 0;
        }
      }

      @keyframes pulse {
        50% {
          transform: scale(1.08);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .leaf,
        .tail,
        .steam,
        .chimney-smoke,
        .speaker {
          animation: none;
        }

        .cat,
        .dial,
        .book,
        .door-panel,
        .flower,
        .caption,
        body {
          transition: none;
        }
      }
    </style>

    <script>
      const house = document.querySelector(".house");
      const caption = document.getElementById("caption");
      const hint = document.getElementById("hint");
      const theme = document.querySelector('meta[name="theme-color"]');
      const lamp = house.querySelector('[data-id="lamp"]');
      const door = house.querySelector('[data-id="door"]');

      const PLACES = ["window", "lamp", "books", "plant", "kettle", "radio", "cat", "door", "photo"];
      const STORE = "casa-touched";
      const skies = ["dusk", "day", "night"];
      const skyLine = {
        day: "A clear bit of sky. Unusual, and welcome.",
        night: "Enough stars to count, if you are patient.",
        dusk: "The light goes pink for about nine minutes.",
      };
      const skyStop = {
        dusk: ["#f0b48a", "#6a4d86"],
        day: ["#e8eef5", "#9eb4c9"],
        night: ["#1c2748", "#0c1020"],
      };
      const themeColor = { dusk: "#241c28", day: "#d5deea", night: "#090b12" };
      const bookLines = [
        "A novel with a train ticket still in it.",
        "Field notes, mostly about other people's kitchens.",
        "A dictionary, open to a word meant for later.",
      ];
      const stationLines = [
        "A voice reading the shipping forecast, very far away.",
        "A song you knew in another kitchen.",
        "Static, then a laugh from the next room.",
        "The radio hums, and says nothing in particular.",
      ];

      let skyAt = 0;
      let bookAt = -1;
      let station = -1;
      let sayToken = 0;
      let playToken = 0;
      let audio = null;
      let seen = new Set();

      try {
        seen = new Set(JSON.parse(localStorage.getItem(STORE) || "[]"));
      } catch (_) {}

      if (seen.size >= PLACES.length) {
        hint.textContent = "That's the whole house. It will still be here.";
      }

      function say(text) {
        const token = ++sayToken;
        caption.classList.add("is-out");
        window.setTimeout(() => {
          if (token !== sayToken) return;
          caption.textContent = text;
          caption.classList.remove("is-out");
        }, 140);
      }

      function setSky(id) {
        house.dataset.sky = id;
        document.body.dataset.sky = id;
        const [a, b] = skyStop[id];
        document.getElementById("skyA").setAttribute("stop-color", a);
        document.getElementById("skyB").setAttribute("stop-color", b);
        theme.setAttribute("content", themeColor[id]);
      }

      function remember(id) {
        if (!PLACES.includes(id) || seen.has(id)) return;
        seen.add(id);
        try {
          localStorage.setItem(STORE, JSON.stringify([...seen]));
        } catch (_) {}
        if (seen.size === PLACES.length) {
          hint.textContent = "That's the whole house. It will still be here.";
        }
      }

      function ac() {
        if (!audio) audio = new AudioContext();
        return audio;
      }

      function tone(ctx, freq, when, dur, type, gain) {
        const t = ctx.currentTime + when;
        const osc = ctx.createOscillator();
        const amp = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, t);
        amp.gain.setValueAtTime(0.0001, t);
        amp.gain.exponentialRampToValueAtTime(gain, t + 0.02);
        amp.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        osc.connect(amp);
        amp.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + dur + 0.05);
      }

      function burst(ctx) {
        const length = Math.floor(ctx.sampleRate * 0.28);
        const buffer = ctx.createBuffer(1, length, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < length; i += 1) {
          data[i] = (Math.random() * 2 - 1) * (1 - i / length);
        }
        const src = ctx.createBufferSource();
        const filter = ctx.createBiquadFilter();
        const amp = ctx.createGain();
        src.buffer = buffer;
        filter.type = "highpass";
        filter.frequency.value = 900;
        amp.gain.value = 0.04;
        src.connect(filter);
        filter.connect(amp);
        amp.connect(ctx.destination);
        src.start();
      }

      function playStation(index) {
        const start = () => {
          const ctx = ac();
          if (index === 0) {
            tone(ctx, 196, 0, 0.7, "sine", 0.045);
            tone(ctx, 246, 0.16, 0.7, "sine", 0.035);
            tone(ctx, 164, 0.36, 0.8, "triangle", 0.03);
          } else if (index === 1) {
            tone(ctx, 262, 0, 0.28, "triangle", 0.04);
            tone(ctx, 330, 0.22, 0.28, "triangle", 0.04);
            tone(ctx, 392, 0.44, 0.4, "sine", 0.045);
          } else if (index === 2) {
            burst(ctx);
            tone(ctx, 784, 0.26, 0.1, "sine", 0.04);
            tone(ctx, 988, 0.38, 0.12, "sine", 0.035);
          } else {
            tone(ctx, 110, 0, 0.9, "sine", 0.03);
          }
        };
        try {
          const ctx = ac();
          const token = ++playToken;
          house.classList.add("is-playing");
          window.setTimeout(() => {
            if (token === playToken) house.classList.remove("is-playing");
          }, 700);
          if (ctx.state === "running") start();
          else ctx.resume().then(start);
        } catch (_) {}
      }

      function activate(id) {
        remember(id);
        if (id === "window") {
          skyAt = (skyAt + 1) % skies.length;
          const sky = skies[skyAt];
          setSky(sky);
          say(skyLine[sky]);
          return;
        }
        if (id === "lamp") {
          const lit = house.dataset.lamp !== "off";
          house.dataset.lamp = lit ? "off" : "on";
          lamp.setAttribute("aria-pressed", String(!lit));
          say(lit ? "Darker. The street is still there." : "The lamp prefers to be the only light.");
          return;
        }
        if (id === "books") {
          bookAt = (bookAt + 1) % bookLines.length;
          house.dataset.book = String(bookAt);
          say(bookLines[bookAt]);
          return;
        }
        if (id === "plant") {
          const bloom = house.classList.toggle("is-bloom");
          say(bloom ? "A flower, unprompted." : "It leans toward whichever window was open last.");
          return;
        }
        if (id === "kettle") {
          const hot = house.classList.toggle("is-boiling");
          say(
            hot
              ? "Still warm. Someone left the kitchen a minute ago."
              : "It clicks off. The counter remembers the heat."
          );
          return;
        }
        if (id === "radio") {
          station = (station + 1) % stationLines.length;
          house.dataset.station = String(station);
          say(stationLines[station]);
          playStation(station);
          return;
        }
        if (id === "cat") {
          const sill = house.dataset.cat !== "sill";
          house.dataset.cat = sill ? "sill" : "bed";
          say(sill ? "The cat has taken the windowsill." : "Back on the duvet. The moon can wait.");
          return;
        }
        if (id === "door") {
          const open = house.classList.toggle("is-open");
          door.setAttribute("aria-pressed", String(open));
          say(open ? "The door sticks a little. Come in. Shoes wherever." : "Closed, but not locked.");
          return;
        }
        if (id === "photo") {
          const back = house.dataset.photo !== "back";
          house.dataset.photo = back ? "back" : "front";
          say(
            back
              ? "On the back, a date and nothing else."
              : "A photograph of a kitchen that is not this one."
          );
        }
      }

      house.addEventListener("click", (event) => {
        const hit = event.target.closest(".hit");
        if (!hit) return;
        activate(hit.dataset.id);
      });

      house.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" && event.key !== " ") return;
        const hit = event.target.closest(".hit");
        if (!hit) return;
        event.preventDefault();
        activate(hit.dataset.id);
      });
    </script>
