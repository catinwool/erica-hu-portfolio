            render();
            return;
          }
          if (form.dataset.act === "save") {
            const fields = Object.fromEntries(new FormData(form).entries());
            const data = await api({ kind: "save", ...fields });
            const id = data.article && data.article.id;
            if (id) location.hash = hash(["read", id]);
            else render();
            return;
          }
          if (form.dataset.act === "mail") {
            const data = await api({ kind: "unlock", mail: true });
            if (data.step === "code") {
              state.error = "";
              render();
              return;
            }
            await load();
            state.error = "";
            render();
            return;
          }
          if (form.dataset.act === "unlock") {
            const password = new FormData(form).get("password");
            const data = await api({ kind: "unlock", password });
            if (data.step === "code") {
              state.error = "";
              render();
              return;
            }
            await load();
            state.error = "";
            render();
            return;
          }
          if (form.dataset.act === "code") {
            const code = new FormData(form).get("code");
            await api({ kind: "code", code });
            await load();
            state.error = "";
            render();
            return;
          }
        } catch (error) {
          say(error.message);
          if (submit) {
            submit.disabled = false;
            if (submit.dataset.label) submit.textContent = submit.dataset.label;
          }
        }
      });

      function selectionText(range, body) {
        const walker = document.createTreeWalker(body, NodeFilter.SHOW_TEXT);
        const parts = [];
        let lastBlock = null;
        let node;
        while ((node = walker.nextNode())) {
          if (!range.intersectsNode(node) || !node.nodeValue) continue;
          let start = 0;
          let end = node.nodeValue.length;
          if (node === range.startContainer) start = range.startOffset;
          if (node === range.endContainer) end = range.endOffset;
          if (end <= start) continue;
          const slice = node.nodeValue.slice(start, end);
          if (!slice) continue;
          const block = node.parentElement && node.parentElement.closest("p, h2, li, figcaption, blockquote");
          if (parts.length && block !== lastBlock) parts.push(" ");
          lastBlock = block;
          parts.push(slice);
        }
        return parts.join("").replace(/\s+/g, " ").trim();
      }

      function selectedLine() {
        const selection = window.getSelection();
        if (!selection || selection.isCollapsed || selection.rangeCount === 0) return null;
        const range = selection.getRangeAt(0);
        const body = document.getElementById("body");
        if (!body) return null;
        const startEl = range.startContainer.nodeType === 1 ? range.startContainer : range.startContainer.parentElement;
        const endEl = range.endContainer.nodeType === 1 ? range.endContainer : range.endContainer.parentElement;
        if (!startEl || !endEl || !body.contains(startEl) || !body.contains(endEl)) return null;
        if (startEl.closest("mark") || endEl.closest("mark")) return null;
        const text = selectionText(range, body);
        if (text.length < 2 || text.length > 8000 || !/[A-Za-z0-9]/.test(text)) return null;
        const article = articleById(state.articleId);
        if (!article || !passageOf(article).includes(text)) return null;
        if (state.quotes.some((quote) => quote.articleId === article.id && quote.text === text)) return null;
        const rects = range.getClientRects();
        const rect = rects[rects.length - 1];
        if (!rect || (!rect.width && !rect.height)) return null;
        return { text, rect };
      }

      function placePair(rect) {
        const gap = 8;
        const total = keep.offsetWidth + gap + letgo.offsetWidth;
        const left = Math.min(Math.max(8, rect.left), window.innerWidth - total - 8);
        const above = rect.top > 56;
        const top = above ? rect.top : rect.bottom + 8;
        const transform = above ? "translate(0, calc(-100% - 8px))" : "none";
        keep.style.left = left + "px";
        keep.style.top = top + "px";
        keep.style.transform = transform;
        letgo.style.left = left + keep.offsetWidth + gap + "px";
        letgo.style.top = top + "px";
        letgo.style.transform = transform;
      }

      function showNote(mark) {
        const id = mark.dataset.quote || "";
        if (!id) return;
        const rects = mark.getClientRects();
        const rect = rects[0] || mark.getBoundingClientRect();
        keep.dataset.quote = id;
        keepText = "";
        letgo.dataset.id = id;
        const ink = mark.dataset.ink || "yellow";
        keep.querySelectorAll("[data-ink]").forEach((pen) => {
          if (pen.dataset.ink === ink) pen.setAttribute("aria-pressed", "true");
          else pen.removeAttribute("aria-pressed");
        });
        keep.hidden = false;
        letgo.hidden = false;
        placePair(rect);
      }

      function placeFloat(button, rect) {
        const width = button.offsetWidth || 160;
        const left = Math.min(Math.max(8, rect.left), window.innerWidth - width - 8);
        button.style.left = left + "px";
        if (rect.top > 56) {
          button.style.top = rect.top + "px";
          button.style.transform = "translate(0, calc(-100% - 8px))";
          return;
        }
        button.style.top = rect.bottom + 8 + "px";
        button.style.transform = "none";
      }

      function considerSelection() {
        if (state.view !== "read" || state.locked) {
          hideFloats();
          return;
        }
        const found = selectedLine();
        if (!found) {
          if (!keep.dataset.quote) {
            keep.hidden = true;
            keepText = "";
          }
          return;
        }
        delete keep.dataset.quote;
        letgo.hidden = true;
        keep.querySelectorAll("[aria-pressed]").forEach((pen) => pen.removeAttribute("aria-pressed"));
        keepText = found.text;
        keep.hidden = false;
        placeFloat(keep, found.rect);
      }

      document.addEventListener("mouseup", () => setTimeout(considerSelection, 0));
      document.addEventListener("selectionchange", () => {
        if (state.view !== "read") return;
        setTimeout(considerSelection, 0);
      });
      window.addEventListener("scroll", () => {
        if (keep.hidden) return;
        if (keep.dataset.quote) {
          const mark = document.querySelector(`#body mark[data-quote="${CSS.escape(keep.dataset.quote)}"]`);
          const rect = mark && (mark.getClientRects()[0] || mark.getBoundingClientRect());
          if (!rect || !rect.width) {
            hideFloats();
            return;
          }
          placePair(rect);
          return;
        }
        considerSelection();
      }, { passive: true });
      let placeTimer = 0;
      window.addEventListener("scroll", () => {
        if (state.view !== "read") return;
        clearTimeout(placeTimer);
        placeTimer = setTimeout(rememberPlace, 280);
      }, { passive: true });
      window.addEventListener("pagehide", rememberPlace);
      document.addEventListener("mousedown", (event) => {
        if (event.target.closest("#keep, #letgo, mark")) return;
        hideFloats();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") hideFloats();
      });
      keep.addEventListener("mousedown", (event) => event.preventDefault());
      letgo.addEventListener("mousedown", (event) => event.preventDefault());
      keep.addEventListener("click", async (event) => {
        const pen = event.target.closest("[data-ink]");
        if (!pen) return;
        const ink = pen.dataset.ink;
        const quoteId = keep.dataset.quote || "";
        const text = keepText;
        const articleId = state.articleId;
        const same = pen.getAttribute("aria-pressed") === "true";
        hideFloats();
        window.getSelection()?.removeAllRanges();
        if (quoteId) {
          if (same) return;
          try {
            await api({ kind: "ink", id: quoteId, ink });
            state.error = "";
            render();
          } catch (error) {
            say(error.message);
          }
          return;
        }
        if (!text || !articleId) return;
        try {
          await api({ kind: "keep", articleId, text, ink });
          state.error = "";
          render();
        } catch (error) {
          say(error.message);
        }
      });
      letgo.addEventListener("click", async () => {
        const id = letgo.dataset.id;
        hideFloats();
        if (!id) return;
        try {
          await api({ kind: "let-go", id });
          state.error = "";
          render();
        } catch (error) {
          say(error.message);
        }
      });

      const searchForm = document.querySelector(".search");
      const searchBox = document.getElementById("search");
      searchForm.addEventListener("submit", (event) => event.preventDefault());
      searchBox.addEventListener("input", () => {
        const query = searchBox.value.trim();
        const next = query ? hash(["search", query]) : "#articles";
        if (location.hash !== next) location.hash = next;
      });
      searchBox.addEventListener("keydown", (event) => {
        if (event.key !== "Escape") return;
        searchBox.value = "";
        if (location.hash !== "#articles") location.hash = "#articles";
      });
      document.addEventListener("keydown", (event) => {
        if (event.key !== "/" || event.metaKey || event.ctrlKey || event.altKey) return;
        const typing = document.activeElement && document.activeElement.closest("input, textarea");
        if (typing || searchBox.hidden) return;
        event.preventDefault();
        searchBox.focus();
      });

      document.getElementById("lock").addEventListener("click", async () => {
        try {
          await api({ kind: "logout" });
          render();
        } catch (error) {
          say(error.message);
        }
      });

      document.getElementById("folders").addEventListener("click", () => {
        foldersOpen = !foldersOpen;
        paintFolders();
      });

      document.addEventListener("keydown", (event) => {
        if (event.key !== "Escape" || !foldersOpen) return;
        foldersOpen = false;
        paintFolders();
      });

      document.getElementById("tags").addEventListener("click", (event) => {
        if (event.target.closest("a")) {
          foldersOpen = false;
          paintFolders();
        }
        const button = event.target.closest("[data-rank]");
        if (!button) return;
        state.folderOrder = button.dataset.rank === "recent" ? "recent" : "alpha";
        try {
          localStorage.setItem("bookmark-folder-rank", state.folderOrder);
        } catch {
          /* the choice still applies for this visit */
        }
        if (state.view === "quotes") render();
        else renderTags(shelfArticles());
      });

      load().then(() => {
        render();
        window.addEventListener("hashchange", () => {
          rememberPlace();
          render();
        });
      });
    </script>
  </body>
</html>
